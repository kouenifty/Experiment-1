name: Deploy to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages on every push to the default branch.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# To use Supabase, add repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables). Without them the site runs in demo mode.

on:
  push:
    branches: [main, claude/charming-hamilton-t2aelb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
